name: Deployment compatibility and releases
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_id:
        description: Bundle release ID (defaults to the commit SHA)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The runner's Docker 28.0 client lacks image inspect --platform.
      - name: Install the pinned Docker CLI and Engine
        env:
          DOCKER_PACKAGE_VERSION: 5:29.7.2-1~ubuntu.24.04~noble
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/sparsity-docker.asc
          sudo chmod 0644 /etc/apt/keyrings/sparsity-docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/sparsity-docker.asc] https://download.docker.com/linux/ubuntu noble stable" > "$RUNNER_TEMP/sparsity-docker.list"
          apt_options=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/sparsity-docker.list" -o "Dir::Etc::sourceparts=-")
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends "docker-ce=$DOCKER_PACKAGE_VERSION" "docker-ce-cli=$DOCKER_PACKAGE_VERSION"
          sudo systemctl restart docker
          docker version
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ubuntu-test
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=node-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=node-${{ matrix.arch }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: sparsity:release
          cache-from: type=gha,scope=node-${{ matrix.arch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Package prebuilt images
        id: package
        env:
          RELEASE_INPUT: ${{ inputs.release_id }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          release_id="$RELEASE_INPUT"
          if [[ -z "$release_id" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              release_id="$GITHUB_REF_NAME"
            else
              release_id="commit-${GITHUB_SHA:0:12}"
            fi
          fi
          npm run release:pack -- --release "$release_id" --platform "linux/$RELEASE_ARCH"
          echo "archive=outputs/releases/sparsity-$release_id-linux-$RELEASE_ARCH.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Verify the packaged release with Docker and Compose
        env:
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: npm run test:release -- "$RELEASE_ARCHIVE"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: sparsity-linux-${{ matrix.arch }}
          path: |
            outputs/releases/*.tar.gz
            outputs/releases/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  sites:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check && npm run lint && npm test
      - run: npm run build && npm run verify
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [node, sites]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sparsity-linux-*
          merge-multiple: true
          path: release-assets
      - name: Publish verified release bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/*.tar.gz release-assets/*.sha256 --verify-tag --generate-notes
