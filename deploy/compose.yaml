name: sparsity
services:
  app:
    image: ${SPARSITY_IMAGE:?Use deploy/manage.sh}
    init: true
    restart: unless-stopped
    env_file: ${SPARSITY_ENV_FILE:?Use deploy/manage.sh}
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: '3000'
      RELEASE_ID: ${SPARSITY_RELEASE:?Use deploy/manage.sh}
    volumes:
      - ${SPARSITY_ROOT:?Use deploy/manage.sh}/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  proxy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    environment:
      SITE_ORIGIN: ${SITE_ORIGIN:?Set SITE_ORIGIN in config.env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SPARSITY_ROOT}/caddy-data:/data
      - ${SPARSITY_ROOT}/caddy-config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
